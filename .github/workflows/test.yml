# 🔴 THE GATE THAT STANDS BETWEEN A MERGE AND A DEPLOYMENT.
#
# Measured on 11 September 2026: every merge to `main` produces a PRODUCTION
# deployment, three to five seconds after the merge commit. Until this file
# existed, NOTHING ran between the two. The only thing protecting the estate was
# that the deployment had nothing to serve.
#
# 🔄 SUPERSEDED 14 September 2026: merges no longer deploy. vercel.json has read
# {"git": {"deploymentEnabled": false}} since 774791b (12 September 2026). This
# workflow still runs on every pull request and every push to main; whether it is
# a REQUIRED check cannot be read on this plan (branch protection returns 403).
# See DEP-1 in PHASE_0_FROZEN_GAP_REGISTER.md.
#
# ⚠️ THIS WORKFLOW DOES NOT DEPLOY, AND MUST NOT.
# It has no deploy step, no secret, no token, no environment, no `write`
# permission and no access to any provider. It runs the test suite and the
# boundary census, and reports. Deployment is Vercel's Git integration, which
# this repository does not control and does not touch here.
#
# ── WHY THERE IS NO INSTALL STEP ────────────────────────────────────────────
# `package.json` declares zero dependencies and ONE devDependency: playwright-core,
# pinned exactly (13 September 2026), for the offline renderer. It is deliberately
# NOT installed here: installing it and a browser would cost minutes on every
# push, and the suite does not need it. `src/render/renderer.mjs` imports it
# lazily, so everything loads without it; the tests that drive a real browser
# SKIP here with their reason printed, and run on a machine that has it. The
# suite is otherwise `node --test` over plain ESM.
#
# ⚠️ AND MINUTES ARE NOT FREE HERE. This repository is PRIVATE, so every minute
# draws on the account's Actions allowance (public repositories are free). The
# job is kept to one runner, one Node version and no install for that reason.

name: test

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read the code, write nothing.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 🔴 SINCE 14 SEPTEMBER 2026 A PRODUCT'S OWN DATA LIVES OUTSIDE THIS REPOSITORY (owner ruling, Option A), in the
    # private repository smnasiruz016-blip/almi-visibility-data. The runner checks out BOTH, as sibling folders — the
    # same layout as C:\Projects on the owner's machine — so config/subject-roots.mjs's default external root
    # (../almi-visibility-data) resolves here unchanged, with no override and no path written for CI alone.
    #
    # ⚠️ The data repository is private. Reading it needs a READ-ONLY credential the owner adds as the repository
    # secret ALMI_VISIBILITY_DATA_TOKEN (a fine-grained token with Contents: read on that one repository). Without it
    # the second checkout fails and the job goes red — loudly, never by skipping the tests that read the data.
    # Least privilege is unchanged: this job still writes nothing.
    defaults:
      run:
        working-directory: almi-visibility
    steps:
      - uses: actions/checkout@v4
        with:
          path: almi-visibility

      - uses: actions/checkout@v4
        with:
          repository: smnasiruz016-blip/almi-visibility-data
          token: ${{ secrets.ALMI_VISIBILITY_DATA_TOKEN }}
          path: almi-visibility-data
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime every Vercel project in the estate reports: 24.x
          node-version: '24'

      - name: node --test
        run: npm test

      # 🔴 The boundary law is run SEPARATELY as well as inside the suite.
      # Inside the suite it is one test among many and its number is invisible;
      # here the count is printed, so a reviewer sees whether it is 0 without
      # opening a log fold. The script exits non-zero when it is not.
      - name: product boundary census
        run: npm run boundary
