a.btnlink{display:inline-block;font-weight:600;padding:6px 14px;border-radius:999px;border:1px solid var(--coral);color:var(--ink);text-decoration:none;font-size:13px} .jobst{font-weight:600} .plainsum{font-size:16px;margin:4px 0 10px} .report{border-top:1px solid var(--peach);margin-top:12px;padding-top:10px} .report h3{font-size:18px} .bigrow{margin-top:14px} .fcard .fgo{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:9999px;background:var(--coral,#FF7A6B);color:var(--ink,#1A1A2E);font-weight:600}details.more{margin-top:10px} details.more summary{cursor:pointer;color:var(--muted)} .twochoice{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

<body>
<header><img class="maker" src="/brand/almiworld-logo.png" alt="AlmiWorld — live beautifully"><span class="app">Visibility</span><span class="lic" id="lic"></span><span class="hdr"><button class="ghost small" id="helpbtn" type="button">Help</button> <button class="ghost small" id="updchk" type="button">Check for updates</button> <span class="meta" id="updmsg" role="status"></span></span></header>
<div class="band"></div>
<div id="updbar" class="updbar"></div>
<div id="jobbar" class="updbar" aria-live="polite"></div>
<div id="backbar" class="backbar"></div>
<main id="app"></main>
<div id="nextbar" class="nextbar"></div>
<footer>Made by <b>AlmiWorld</b> · live beautifully · <span id="ver"></span></footer>
<script>
const $ = (s) => document.querySelector(s);
/* RR-323: a Keyword Planner export is UTF-16 — File.text() reads every file as UTF-8; the byte-order mark decides */
const fileText = async (f) => { const b = new Uint8Array(await f.arrayBuffer()); return b[0] === 0xff && b[1] === 0xfe ? new TextDecoder("utf-16le").decode(b.subarray(2)) : b[0] === 0xfe && b[1] === 0xff ? new TextDecoder("utf-16be").decode(b.subarray(2)) : new TextDecoder("utf-8").decode(b); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const get = (p) => fetch(p).then((r) => r.json());
const post = async (p, o) => { const r = await fetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(o) }); const j = await r.json(); if (r.ok && !j?.refused) DIRTY = false; return j; }; // RR-315 B: what was typed is saved now
let P = null, S = null, step = 0;
/* RR-307 (owner, 22 Oct): a screen that fails says so in plain words, with a way back — never a blank page (the Dhanak YouTube settings went blank) */
/*
 * RR-314 A1: Google's sign-in page opened in the client's own browser — said, with the address to copy if no page opened; this screen
 * checks every 3 seconds (for 10 minutes) and redraws itself once the sign-in is done.
 */
function signinOpened(box, r, who, done, redraw) {
  box.classList.remove("err"); box.className = "msg-info";
  box.innerHTML = r.opened ? `Google's sign-in page opened in ${r.opened === "Chrome" ? "Chrome" : "your browser"}. ${esc(who)} This screen updates by itself when you are done.`
    : `Your browser did not open by itself. Copy this address into your browser: <code class="addr">${esc(r.url)}</code> ${copyBtn(r.url)} — ${esc(who)}`;
  wireCopy(box);
  let n = 0; const t = setInterval(async () => { n++; try { if (await done()) { clearInterval(t); redraw(); } } catch {} if (n >= 200) clearInterval(t); }, 3000);
}
/*
 * RR-314 A3 (owner: "never show it on a page that did open"). The big "This screen could not open" card is shown ONLY when the screen is
 * empty; a slip on a screen that DID open is a small line at the bottom, and the screen stays as it is.
 */
function oops() {
  if ($("#oops") || $("#slip")) return;
  if ($("#app").children.length) { const s = document.createElement("p"); s.id = "slip"; s.className = "msg-info"; s.textContent = "Something on this screen did not work just now — nothing was changed. Try again, or go back to your products."; $("#app").append(s); setTimeout(() => s.remove(), 8000); return; }
  const box = document.createElement("div"); box.className = "card"; box.id = "oops";
  box.innerHTML = `<h2>This screen could not open</h2><p>Something went wrong on this screen. Your data is safe — nothing was changed.</p><button id="oopshome">Back to my products</button>`;
  $("#app").prepend(box); $("#oopshome").onclick = () => { box.remove(); home(); };
}
/*
 * RR-315 B (owner: "Back and Next buttons"). Every screen is a step in the window's own history: "← Back" (at the top of every screen, and
 * the browser's own Back / Alt+←) returns to the screen before — the same product, the same tab, the same setup step. Anything typed and not
 * yet saved is never lost without asking: leaving such a screen asks first ("Stay" keeps it).
 */
let DIRTY = false, RESTORING = false, CUR = null;
const SCREENS = {};
const sameState = (a, b) => a && b && a.name === b.name && a.P === b.P && a.step === b.step && JSON.stringify(a.args) === JSON.stringify(b.args);
document.addEventListener("input", (e) => { if (e.target?.closest?.("#app") && !e.target.closest(".nodirty")) DIRTY = true; }, true);
document.addEventListener("change", (e) => { if (e.target?.closest?.("#app") && !e.target.closest(".nodirty")) DIRTY = true; }, true);
function askLeave() {
  return new Promise((done) => {
    const t = document.createElement("div"); t.className = "tour"; t.id = "leavemodal";
    t.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h2>Leave without saving?</h2><p>You typed something on this screen that is not saved yet. If you leave now, it is lost.</p><p><button id="leaveno">Stay on this screen</button> <button class="ghost" id="leaveyes">Leave without saving</button></p></div>`;
    document.body.appendChild(t);
    $("#leaveno").onclick = () => { t.remove(); done(false); };
    $("#leaveyes").onclick = () => { t.remove(); done(true); };
  });
}
/** called first by every screen: asks before typed data is lost, then records the screen in the window's history */
async function here(name, args = []) {
  if (RESTORING) RESTORING = false;
  else {
    if (DIRTY && !(await askLeave())) return false;
    const st = { name, args, P, step }, cur = history.state;
    if (!cur?.name) history.replaceState({ ...st, depth: 0 }, "");
    else if (sameState(cur, st)) history.replaceState({ ...st, depth: cur.depth }, "");
    else history.pushState({ ...st, depth: (cur.depth ?? 0) + 1 }, "");
  }
  DIRTY = false; CUR = history.state;
  const bar = $("#backbar"); bar.innerHTML = CUR?.depth > 0 ? `<button class="ghost" id="navback" type="button">← Back</button>` : "";
  if ($("#navback")) $("#navback").onclick = () => history.back();
  /* RR-353 (owner: "navigation on EVERY screen"): where you are — All products › the product › the screen — each part opens itself */
  bar.innerHTML += crumbsHtml(name, args);
  guideBars(name, args); // RR-359: what this screen is for (top), its next step (bottom)
  if ($("#crumbhome")) $("#crumbhome").onclick = () => home();
  if ($("#crumbprod")) $("#crumbprod").onclick = () => work("Overview");
  return true;
}
/*
 * 🔴 RR-359 (owner: "I did not know where to start"): the first screen has a START HERE card — the six steps of a run — and EVERY screen
 * says in one line what it is for (at the top) and offers its next step (a button at the bottom).
 */
/* RR-359: "Set it now" opens Settings → Your product with "What it is about" ready to type */
const askSubject = async () => { await settings("product"); $("#f7")?.focus(); $("#f7")?.scrollIntoView({ block: "center" }); };
const START_STEPS = [["Open your product", "press its button below (or + New product)"], ["Home", "it opens first: your score and what to do now"], ["Tick what you want", "under \"What do you want done?\""], ["Choose", "\"Show me before publishing\" or \"Publish for me\""], ["Press Start", "Visibility does each job to the end by itself"], ["Pages", "press \"Read it\" on each page, then \"Approve & Publish\" — or \"Fix\""]];
function startHereHtml(H) {
  const first = H.products[0];
  return `<div class="card starthere" id="starthere"><h2>Start here</h2><ol>${START_STEPS.map(([b, t]) => `<li><b>${esc(b)}</b> — ${esc(t)}.</li>`).join("")}</ol><p>${first ? `<button id="startopen" type="button" data-open="${esc(first.id)}">Step 1: open ${esc(first.name)} →</button>` : `<button id="startadd" type="button">Step 1: add your first product →</button>`}</p></div>`;
}
const OVERVIEW = { label: "Next: Home →", go: () => work("Overview") }, PAGES = { label: "Next: Pages →", go: () => work("Pages and articles") }, PRODUCTS = { label: "Back to your products →", go: () => home() };
const SCREEN_GUIDE = {
  home: { line: "Your products — start with Start here below.", next: null },
  "work:Overview": { line: "Your score, what to fix first, and the jobs Visibility does for you — tick them and press Start.", next: PAGES },
  "work:Pages and articles": { line: "The pages Visibility made — Read it, then Approve & Publish, or Fix.", next: { label: "Back to Home →", go: () => work("Overview") } },
  "work:Approvals": { line: "Pages waiting for your yes (you chose \"Show me before publishing\").", next: PAGES },
  "work:YouTube": { line: "Advice for your channel and each video, and new video ideas.", next: OVERVIEW },
  "work:Monthly report": { line: "The month in one report — bad news first.", next: OVERVIEW },
  setup: { line: "Your product's details: its name, website, what it is about and your offer button.", next: OVERVIEW },
  publishScreen: { line: "Where your pages are published — your site, connected once.", next: PAGES },
  editScreen: { line: "Change a page's words before you publish it.", next: PAGES },
  googleScreen: { line: "Connect Google Search Console — what people search to find you.", next: OVERVIEW },
  pageCountScreen: { line: "How many useful pages this product can have — counted from official lists.", next: OVERVIEW },
  searchScreen: { line: "Where your pages show in Google, from your Search Console.", next: OVERVIEW },
  youtubeSettings: { line: "Your YouTube channel's settings.", next: { label: "Next: YouTube advice →", go: () => work("YouTube") } },
  enginesScreen: { line: "Tell Google and Bing about your published pages.", next: OVERVIEW },
  bingScreen: { line: "Connect Bing Webmaster Tools — what people search on Bing.", next: OVERVIEW },
  socialLinksScreen: { line: "Your social media pages — linked from your pages.", next: OVERVIEW },
  searchDataScreen: { line: "Optional — Google's results from your own DataForSEO account, only if you want it. AlmiSEO Data and your own AI in your browser need no other service.", next: OVERVIEW },
  almiSeoScreen: { line: "AlmiWorld's own research for this product — no other service needed.", next: OVERVIEW },
  planScreen: { line: "Your Visibility plan and licence key.", next: PRODUCTS },
  company: { line: "Your company's name, website and logo.", next: PRODUCTS },
  addProduct: { line: "Add a product: its name and website.", next: PRODUCTS },
  googleSignInScreen: { line: "Sign in with Google once — for Search Console.", next: PRODUCTS },
