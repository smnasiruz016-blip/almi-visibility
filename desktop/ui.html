<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AlmiVisibility</title>
<style>
/*SUNRISE*/
body{margin:0;background:var(--cream);color:var(--text);font:15px/1.55 var(--font);min-height:100vh;display:flex;flex-direction:column}
main{flex:1 0 auto;width:100%;box-sizing:border-box}
h1,h2,h3{color:var(--ink);margin:0 0 6px} h1{font-size:22px} h2{font-size:18px}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--white);border-bottom:3px solid var(--peach);flex-wrap:wrap}
header img.maker{height:44px;width:auto}
header .app{font-weight:700;color:var(--ink);font-size:16px}
header .lic{margin-left:auto;color:var(--muted);font-size:13px;max-width:420px}
@media (max-width:560px){header .lic{margin-left:0;flex-basis:100%}}
.band{height:6px;background:linear-gradient(90deg,var(--coral),var(--sunrise),var(--peach))}
main{max-width:860px;margin:22px auto;padding:0 16px}
.card{background:var(--white);border:1px solid var(--peach);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(26,26,46,.04)}
.company{display:flex;align-items:center;gap:14px}
.company img{height:48px;width:auto;border-radius:8px;border:1px solid var(--peach)}
.company .site{color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.product{background:var(--white);border:1px solid var(--peach);border-radius:16px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.product:hover,.product:focus{border-color:var(--sunrise);outline:none;box-shadow:0 0 0 3px var(--teal)}
.product .addr{color:var(--muted);font-size:13px;word-break:break-all}
.badge{display:inline-block;background:var(--peach);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;margin:8px 0}
.meta{font-size:13px;color:var(--muted)}
.limit{background:var(--peach);color:var(--ink);border-radius:12px;padding:10px 14px;margin:14px 0}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;border:0;background:var(--coral);color:var(--ink);cursor:pointer}
button.alt{background:var(--sunrise)} button.ghost{background:transparent;border:1px solid var(--coral);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.55;cursor:not-allowed}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--peach);border-radius:10px;width:100%;box-sizing:border-box;margin:4px 0 12px;background:var(--white);color:var(--ink)}
label{display:block;color:var(--ink)} .ask{color:var(--muted);margin:0 0 14px} .steps{color:var(--muted);font-size:13px}
.err{color:#9F1D1D;margin-top:8px;font-weight:600}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
footer{background:var(--night);color:var(--cream);padding:14px 20px;font-size:13px;text-align:center} footer b{color:var(--gold)}
/* RR-306: the next step after a licence, keys shown only as "saved ✓ (ends …1234)", the channel confirmation, advice with its source */
button.big{font-size:17px;padding:14px 26px;margin-top:8px}
.ok{color:#1F6F43;font-weight:700} .warn{background:#FFF1E6;border:1px solid var(--sunrise);border-radius:10px;padding:8px 12px;margin:8px 0}
textarea{font:inherit;padding:9px 12px;border:1px solid var(--peach);border-radius:10px;width:100%;box-sizing:border-box;margin:4px 0 12px;min-height:80px;background:var(--white);color:var(--ink)}
.keybox{border:1px dashed var(--peach);border-radius:12px;padding:10px 12px;margin:6px 0 14px}
.chan{display:flex;gap:14px;align-items:center} .chan img{width:72px;height:72px;border-radius:50%;border:1px solid var(--peach)}
.adv{border-top:1px solid var(--peach);padding:10px 0} .adv h3{font-size:15px} .k{font-weight:700;color:var(--ink)}
/* RR-307: every advice box wraps its text (the channel advice was cut off at the right edge) */
#ytbox pre,.card pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:2px 0;background:var(--cream);border-radius:8px;padding:6px 8px;max-width:100%;box-sizing:border-box}
.src{font-size:12px;color:var(--muted)} .tag{display:inline-block;background:var(--peach);border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px}
/* RR-307: the score card, the feature cards, the guided setup's progress, the first-run tour */
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap} .gauge{width:220px;text-align:center} .gauge .n{font-size:34px;font-weight:800;color:var(--ink)} .gauge .w{font-weight:700}
.areas{flex:1;min-width:240px;list-style:none;padding:0;margin:0} .areas li{padding:5px 0;border-bottom:1px solid var(--peach)} .ok-i{color:#1F6F43;font-weight:700} .warn-i{color:#9A5B00;font-weight:700} .nm-i{color:var(--muted)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px} .fcard{background:var(--white);border:1px solid var(--peach);border-radius:14px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.fcard:hover,.fcard:focus{border-color:var(--sunrise);outline:none;box-shadow:0 0 0 3px var(--teal)} .fcard h3{font-size:16px} .fcard p{margin:4px 0;font-size:13px} .rec{background:var(--sunrise);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700} .needs{color:#9A5B00;font-size:12px;font-weight:600}
.choice{display:block;border:1px solid var(--peach);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer} .choice input{width:auto;margin-right:8px} .choice .why{font-size:13px;color:var(--muted)}
.progress{height:8px;background:var(--peach);border-radius:999px;overflow:hidden;margin:6px 0 14px} .progress>div{height:100%;background:var(--coral)}
.howto{font-size:13px;background:var(--cream);border-radius:10px;padding:8px 10px;margin:4px 0 12px} .tabline{color:var(--muted);margin:-4px 0 12px}
.tour{position:fixed;inset:0;background:rgba(26,26,46,.45);display:flex;align-items:center;justify-content:center;z-index:9} .tour .card{max-width:520px}
.paste{white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;background:var(--cream);border-radius:8px;padding:8px;overflow-wrap:anywhere}
@media (max-width:560px){header img.maker{height:36px} .company{flex-direction:column;align-items:flex-start}}
@media (prefers-color-scheme:dark){body{background:var(--night);color:var(--cream)} h1,h2,h3,label{color:var(--cream)} .card,.product,header{background:#1E1A15;border-color:#3A2F22} .meta,.ask,.steps,.company .site,.product .addr,header .lic{color:#E7D9C3} header .app{color:var(--cream)} input,select{background:#1E1A15;color:var(--cream);border-color:#3A2F22}}
</style></head>
<body>
<header><img class="maker" src="/brand/almiworld-logo.png" alt="AlmiWorld — live beautifully"><span class="app">Visibility</span><span class="lic" id="lic"></span></header>
<div class="band"></div>
<main id="app"></main>
<footer>Made by <b>AlmiWorld</b> · live beautifully · <span id="ver"></span></footer>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const get = (p) => fetch(p).then((r) => r.json());
const post = async (p, o) => { const r = await fetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(o) }); return r.json(); };
let P = null, S = null, step = 0;

/* ── the first screen: the company, "What would you like to do now?", its products (RR-307 G: the cards ask; D6: a short first-run tour) ── */
async function home() {
  const H = await get("/api/home");
  $("#ver").textContent = "version " + H.version; $("#lic").textContent = H.licence;
  if (!H.company) return company();
  const M = await get("/api/menu");
  const logo = H.company.logoFile ? `<img src="/company-logo" alt="${esc(H.company.name)} logo">` : "";
  $("#app").innerHTML = `<div class="card company">${logo}<div><h1>${esc(H.company.name)}</h1><div class="site">${esc(H.company.site)}</div></div></div>
  <h2>Your products</h2><div class="limit">${esc(H.limit)}</div>
  <div class="products">${H.products.map((p) => `<button class="product" data-id="${esc(p.id)}"><h3>${esc(p.name)}</h3><div class="addr">${esc(p.site ?? "no website")}</div><span class="badge">${esc(p.state)}</span><div class="meta">Pages ${p.pages} · Articles ${p.articles}</div></button>`).join("") || `<div class="meta">No product yet — add your first one below.</div>`}</div>
  <p style="margin-top:16px"><button id="add" ${H.mayAdd ? "" : "disabled"}>+ Add a product</button> <button class="ghost" id="plan">Your plan${H.accountSet ? "" : " — add your licence key"}</button></p><div class="err" id="err"></div>
  <div class="card" style="margin-top:16px"><h2>${esc(M.question)}</h2><p class="tabline">Everything Visibility can do for you. Pick a card — Visibility asks which product it is for.</p>${cardsHtml(M.cards)}</div>`;
  document.querySelectorAll(".product").forEach((b) => (b.onclick = () => open(b.dataset.id)));
  document.querySelectorAll(".fcard").forEach((b) => (b.onclick = () => { if (!H.products.length) return addProduct(); if (H.products.length === 1) { P = H.products[0].id; return openFeature(b.dataset.f); } $("#err").textContent = "Pick a product above first — then choose this card on its page."; window.scrollTo(0, 0); }));
  $("#add").onclick = () => addProduct();
  $("#plan").onclick = () => planScreen();
  tour();
}
/* the cards, from the app's own feature list: what it does, what you get, time or cost, what it needs; recommended first */
function cardsHtml(cards) {
  const sorted = [...cards.filter((c) => c.recommended), ...cards.filter((c) => !c.recommended)];
  return `<div class="fcards">${sorted.map((c) => `<button class="fcard" data-f="${esc(c.id)}"><h3>${esc(c.title)} ${c.recommended ? `<span class="rec">Recommended for you now</span>` : ""}</h3><p>${esc(c.does)}</p><p><b>You get:</b> ${esc(c.youGet)}</p><p class="meta">${esc(c.time)}</p>${c.needs?.length ? `<p class="needs">Needs: ${esc(c.needs.map((n) => n.what).join("; "))}</p>` : ""}</button>`).join("")}</div>`;
}
async function tour() {
  if (!(await get("/api/tour")).show) return;
  const steps = ["Add a product — your website, your YouTube channel, or both.", "Visibility checks it at once and gives you a score out of 100, with what to fix first.", "Pick a card under \"What would you like to do now?\" — new pages, answers, AI search, YouTube advice and more.", "Nothing is published without your choice. Everything Visibility writes is a draft until you say so."];
  const t = document.createElement("div"); t.className = "tour";
  t.innerHTML = `<div class="card"><h2>Welcome to Visibility</h2><ol>${steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol><button id="tourclose">Got it</button></div>`;
  document.body.appendChild(t);
  $("#tourclose").onclick = async () => { await post("/api/tour", {}); t.remove(); };
}
/* RR-303 A: the licence key from the page shown after a purchase — saved in the app; never shown back.
   RR-306 A1: once saved, a clear "Licence saved ✓" and one big next step. */
function planScreen() {
  $("#app").innerHTML = `<p><button class="ghost" id="home">← All products</button></p><div class="card"><h2>Your plan</h2><p class="ask">Paste the licence key shown after you bought your plan (it starts with av_) — or the owner licence (it starts with avo_).</p>
  <label>Licence key<input id="k1" autocomplete="off" spellcheck="false"></label><button id="save">Save</button><div class="err" id="err"></div></div>`;
  $("#home").onclick = home;
  $("#save").onclick = async () => {
    const r = await post("/api/account", { licenceKey: $("#k1").value }); if (r.refused) return ($("#err").textContent = r.refused);
    const H = await get("/api/home"); $("#lic").textContent = H.licence;
    $("#app").innerHTML = `<div class="card"><h2 class="ok">Licence saved ✓</h2><p>${esc(r.line)}</p><button class="big" id="next">${H.products.length ? "Continue — go to your products" : "Continue — add your first product"}</button></div>`;
    $("#next").onclick = () => (H.products.length || !H.company ? home() : addProduct());
  };
}
/* RR-306 A3: a key box — the client pastes the key; the app shows only "saved ✓ (ends …1234)" and can replace or remove it */
const keyStatus = (st) => (st?.saved ? `<span class="ok">saved ✓ (ends …${esc(st.ends)})</span> <span class="meta">${esc(st.where)}</span>` : `<span class="meta">not saved yet</span>`);
function keyBox(name, label, st) {
  return `<div class="keybox" data-key="${esc(name)}"><div><b>${esc(label)}</b>: <span class="kst">${keyStatus(st)}</span></div>
  <input class="kin" type="password" autocomplete="off" spellcheck="false" placeholder="${st?.saved ? "Paste a new key to replace it" : "Paste your key here"}">
  <button class="ghost ksave" type="button">${st?.saved ? "Replace" : "Save key"}</button> ${st?.saved ? `<button class="ghost kdel" type="button">Remove</button>` : ""}<span class="err kerr"></span></div>`;
}
function wireKeyBoxes(after) {
  document.querySelectorAll(".keybox").forEach((b) => {
    const name = b.dataset.key;
    b.querySelector(".ksave").onclick = async () => { const r = await post(`/api/keys/${name}`, { key: b.querySelector(".kin").value }); b.querySelector(".kin").value = ""; if (r.refused) return (b.querySelector(".kerr").textContent = r.refused); b.querySelector(".kst").innerHTML = keyStatus(r.status); if (after) after(); };
    const del = b.querySelector(".kdel"); if (del) del.onclick = async () => { const r = await post(`/api/keys/${name}/remove`, {}); b.querySelector(".kst").innerHTML = keyStatus(r.status); if (after) after(); };
  });
}
/* RR-303 D + RR-306 B: YouTube settings — the channel found by its EXACT @handle and shown before anything is read ("Is this your channel?"),
   the key, the research topics, related product pages, search-data files */
async function youtubeSettings() {
  const y = await get(`/api/products/${encodeURIComponent(P)}/youtube`);
  const K = await get("/api/keys");
  const conf = y.confirmed ? `<p class="ok">Confirmed: ${esc(y.confirmed.title)} (${esc(y.confirmed.handle)}) — read by its channel ID since ${esc(y.confirmed.on)}.</p>` : "";
  $("#app").innerHTML = `<p><button class="ghost" id="back">← ${esc(S.product.name)}</button></p><div class="card"><h2>YouTube settings</h2>
  <p class="ask">Your channel's @handle. Before anything is read, Visibility shows you the channel and asks if it is yours.</p>${conf}
  <label>Channel @handle<input id="y1" list="pilots" value="${esc(y.handle || y.suggestedHandle || "")}" placeholder="@yourchannel"></label><datalist id="pilots">${y.pilots.map((p) => `<option value="${esc(p.handle)}">${esc(p.name)} (${esc(p.tier)})</option>`).join("")}</datalist>
  <button id="find">Find my channel</button><div id="found"></div>
  ${keyBox("YOUTUBE_API_KEY", "Your YouTube key", K.keys.YOUTUBE_API_KEY)}
  <label>Research topics — what people search for about your product (one per line; from your product's description — change them freely)<textarea id="y3">${esc((y.topics ?? []).join("\n"))}</textarea></label>
  <label>Related pages (optional) — when a video is about one of your products, it should link to that product's page. One per line: words → address<textarea id="y4" placeholder="cv, resume → https://cv.almiworld.com">${esc((y.relatedPages ?? []).map((p) => `${p.words.join(", ")} → ${p.url}`).join("\n"))}</textarea></label>
  <label>Search-data file (optional) — a CSV from Google Search Console, Bing or Keyword Planner (${y.files} phrases added)<input id="y5" type="file" accept=".csv,text/csv"></label>
  <p class="meta">${esc(y.quota)}</p>
  <button id="save">Save</button> <button class="ghost" id="open">Save and open my YouTube advice</button><div class="err" id="err"></div></div>`;
  $("#back").onclick = () => work("YouTube");
  wireKeyBoxes();
  $("#find").onclick = async () => {
    $("#found").innerHTML = `<p class="meta">Looking up ${esc($("#y1").value.trim())}…</p>`;
    const c = await post(`/api/products/${encodeURIComponent(P)}/youtube/lookup`, { handle: $("#y1").value.trim() });
    if (c.refused || !c.found) return ($("#found").innerHTML = `<p class="err">${esc(c.refused ?? c.line)}</p>`);
    $("#found").innerHTML = `<div class="card"><h3>Is this your channel?</h3><div class="chan">${c.picture ? `<img src="${c.picture}" alt="">` : ""}<div><b>${esc(c.title)}</b> <span class="meta">${esc(c.handle)}</span><br><span class="meta">${c.subscribers === null ? "subscribers hidden" : `${c.subscribers.toLocaleString()} subscriber${c.subscribers === 1 ? "" : "s"}`} · ${c.videoCount ?? "?"} video${c.videoCount === 1 ? "" : "s"}</span></div></div>
    ${c.mismatch ? `<div class="warn">${esc(c.mismatch)}</div>` : ""}<p><button id="yes">Yes, this is my channel</button> <button class="ghost" id="no">No — change the @handle</button></p></div>`;
    $("#yes").onclick = async () => { const r = await post(`/api/products/${encodeURIComponent(P)}/youtube/confirm`, { handle: c.handle, channelId: c.channelId }); if (r.refused) return ($("#err").textContent = r.refused); S = await get(`/api/products/${encodeURIComponent(P)}/state`); youtubeSettings(); };
    $("#no").onclick = () => { $("#found").innerHTML = ""; $("#y1").focus(); };
  };
  const save = async () => {
    const related = $("#y4").value.split("\n").map((l) => l.split(/→|->/)).filter((p) => p.length === 2).map(([w, url]) => ({ words: w.trim(), url: url.trim() }));
    const r = await post(`/api/products/${encodeURIComponent(P)}/youtube`, { handle: $("#y1").value.trim(), topics: $("#y3").value.split("\n"), relatedPages: related });
    if (r.refused) { $("#err").textContent = r.refused; return false; }
    const f = $("#y5").files[0];
    if (f) { const x = await post(`/api/products/${encodeURIComponent(P)}/youtube/file`, { name: f.name, text: await f.text() }); if (x.refused) { $("#err").textContent = x.refused; return false; } }
    S = await get(`/api/products/${encodeURIComponent(P)}/state`);
    if (r.mismatch) { $("#err").textContent = r.mismatch; }
    return true;
  };
  $("#save").onclick = async () => { if (await save()) youtubeSettings(); };
  $("#open").onclick = async () => { if (await save()) work("YouTube"); };
}
/* RR-307 E3: an address that does not open is said plainly — with "Use …" when a "www." looks wrong, and "Save anyway" */
function addressTrouble(r, retry) {
  $("#err").innerHTML = `${esc(r.refused)} ${r.suggestion ? `<button class="ghost" id="usesug">Use ${esc(r.suggestion)}</button>` : ""} ${r.canSaveAnyway ? `<button class="ghost" id="anyway">Save anyway</button>` : ""}`;
  if ($("#usesug")) $("#usesug").onclick = () => retry({ site: r.suggestion });
  if ($("#anyway")) $("#anyway").onclick = () => retry({ saveAnyway: true });
}
function company() {
  $("#app").innerHTML = `<div class="card"><h2>Your company</h2><p class="ask">Its name and its main website — your products are listed under it. Your own logo is optional.</p>
  <label>Company name<input id="c1"></label><label>Main website<input id="c2" placeholder="almiworld.com"></label><label>Your logo (PNG, optional)<input id="c3" type="file" accept="image/png"></label>
  <button id="save">Continue</button><div class="err" id="err"></div></div>`;
  const send = async (extra = {}) => {
    const f = $("#c3").files[0]; const logoPng = f ? await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }) : null;
    if (extra.site) $("#c2").value = extra.site;
    const r = await post("/api/company", { name: $("#c1").value, site: $("#c2").value, logoPng, saveAnyway: extra.saveAnyway === true }); if (r.refused) return addressTrouble(r, send); home();
  };
  $("#save").onclick = () => send();
}
/* RR-307 D1: two plain questions first — what to grow, and whether there is a website; only then the website itself */
async function addProduct() {
  const C = (await get("/api/choices")).grow;
  $("#app").innerHTML = `<p><button class="ghost" id="back">← All products</button></p><div class="card"><h2>Add a product</h2>
  <label>Product name<input id="p1" placeholder="for example AlmiOET"></label>
  <h3 style="margin-top:10px">What do you want to grow?</h3>${C.map((c) => `<label class="choice"><input type="radio" name="grow" value="${esc(c.value)}"> <b>${esc(c.label)}</b><div class="why">Choose this if ${esc(c.chooseIf)} You get: ${esc(c.gives)} Cost: ${esc(c.cost)} You need: ${esc(c.needs)}</div></label>`).join("")}
  <h3 style="margin-top:10px">Do you have a website for this product?</h3>
  <label class="choice"><input type="radio" name="hasweb" value="yes"> Yes</label><label class="choice"><input type="radio" name="hasweb" value="no"> No</label>
  <label id="webrow" style="display:none">Its website<input id="p2" placeholder="shop.almiworld.com"></label>
  <button id="go">Continue</button><div class="err" id="err"></div></div>`;
  $("#back").onclick = home;
  document.querySelectorAll("input[name=hasweb]").forEach((r) => (r.onchange = () => ($("#webrow").style.display = r.value === "yes" && r.checked ? "" : "none")));
  const go = async (extra = {}) => {
    const grow = document.querySelector("input[name=grow]:checked")?.value, has = document.querySelector("input[name=hasweb]:checked")?.value;
    if (!grow || !has) return ($("#err").textContent = "Answer both questions — they decide which steps you see.");
    if (extra.site) $("#p2").value = extra.site;
    const r = await post("/api/products", { name: $("#p1").value, site: has === "yes" ? $("#p2").value : "", goal: { grow, hasWebsite: has === "yes" }, saveAnyway: extra.saveAnyway === true });
    if (r.refused) return addressTrouble(r, go);
    P = r.product.id; S = await get(`/api/products/${encodeURIComponent(P)}/state`); step = S.steps.findIndex((x) => x.id === "product"); setup();
  };
  $("#go").onclick = () => go();
}
/* ── one product's own work ── */
let KS = null; // the keys' status (never a key)
const choiceList = (name, list, current, rec) => list.map((c) => `<label class="choice"><input type="radio" name="${name}" value="${esc(c.value)}" ${String(current ?? rec ?? "") === String(c.value) ? "checked" : ""}> <b>${esc(c.label)}</b> ${String(rec) === String(c.value) ? `<span class="rec">Recommended for you</span>` : ""}<div class="why">Choose this if ${esc(c.chooseIf)} You get: ${esc(c.gives)} Cost: ${esc(c.cost)} You need: ${esc(c.needs)}</div>${c.howTo ? `<div class="howto">How: ${esc(c.howTo)}</div>` : ""}</label>`).join("");
const fields = {

      <h4>New pages (${by("NEW").length})</h4><ol>${pg.drafts.map((d) => `<li><b>${esc(d.title)}</b> <span class="meta">${esc(d.url)}</span> — ${d.pass ? `<span class="ok-i">passes all five checks</span>` : d.readyAsDraft ? `<span class="ok-i">ready as a draft</span> <span class="meta">(still to check once it is live: ${esc([...new Set(d.gates.flatMap((g) => g.afterPublishing))].join(", "))})</span>` : `<span class="warn-i">not ready</span>`}
        <ul>${d.gates.map((g) => `<li class="meta">${g.pass || !g.failing.length ? "✓" : "!"} ${esc(g.words)}${g.failing.length ? ` — ${esc(g.failing.join("; "))}` : ""}</li>`).join("")}</ul>
        <div class="src">Searched: ${esc(pg.plan.find((x) => x.question === d.title)?.demand?.source ?? "")}</div> <a href="/api/products/${encodeURIComponent(P)}/draft?url=${encodeURIComponent(d.url)}" target="_blank">Read the draft</a></li>`).join("")}</ol>
      <h4>Improve your existing pages (${by("SECTION").length})</h4><ul>${by("SECTION").map((x) => `<li><b>${esc(x.question)}</b> — ${esc(x.why)}</li>`).join("") || "<li>None.</li>"}</ul>
      <details><summary>Not made — no answer on your pages yet (${by("REFUSED").length})</summary><ul>${by("REFUSED").map((x) => `<li>${esc(x.question)} <span class="src">(${esc(x.demand?.source ?? "")})</span></li>`).join("")}</ul><p class="meta">Write the answer on your site, then press Create SEO pages again.</p></details></div>`);
  }
  if (r.article) return (box.innerHTML = `<div class="card"><h3>Today's article</h3>${r.article.none ? `<p>${esc(r.article.none)}</p>` : `<p><b>${esc(r.article.title)}</b> — a draft for ${esc(r.article.day)}. ${r.article.publishMode === "REVIEW_FIRST" ? "It waits for your yes." : "It stays a draft: Visibility has no connection to your site in this version."}</p><a href="/api/products/${encodeURIComponent(P)}/draft?url=${encodeURIComponent(r.article.url)}" target="_blank">Read the article</a>`}</div>`);
  if (r.social) return (box.innerHTML = `<div class="card"><h3>Social posts</h3>${r.social.posts.length ? r.social.posts.map((p) => `<p><b>${esc(p.network)}</b></p><div class="paste">${esc(p.text)}</div>`).join("") : `<p>${esc(r.social.refused?.[0]?.why ?? "No post yet.")}</p>`}<p class="meta">Copy and post them yourself — Visibility does not post for you in this version.</p></div>`);
  if (r.report) return (box.innerHTML = `<div class="card"><h3>Monthly report</h3><ul>${r.report.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>`);
  box.innerHTML = `<p class="err">${esc(r.refused ?? "Something went wrong — try again.")}</p>`;
}
/* RR-307 E1: Google Search Console — the client's own read-only sign-in, the site picker, or the download file */
async function googleScreen() {
  const O = await get(`/api/products/${encodeURIComponent(P)}/overview`), g = O.google;
  const status = g.kind === "CONNECTED" ? `<p class="ok">Connected ✓ — ${esc(g.site)} (${esc(g.window)})</p>` : g.kind === "EXPORT" ? `<p class="ok">Search Console download added ✓ (${esc(g.window)})</p>` : `<p><b>Not connected</b> — connect now to bring in the real searches people make.</p>`;
  $("#app").innerHTML = `<p><button class="ghost" id="back">← ${esc(S.product.name)}</button></p><div class="card"><h2>Google Search Console</h2>${status}
    <h3>Sign in to Google</h3>${g.ready ? (g.signedIn ? `<p>Signed in ✓ — pick your site:</p><div id="sites"><p class="meta">Loading your sites…</p></div>` : `<p>You sign in yourself, in your browser. Visibility asks only to <b>view</b> your Search Console — it can never change anything.</p><button id="connect">Connect Google</button>`) : `<p class="meta">Google sign-in is not switched on in this copy of Visibility yet. Meanwhile, add Search Console's download file below — it gives the same searches.</p>`}
    <h3 style="margin-top:14px">Or add Search Console's download</h3><div class="howto">${esc(O.howTo.google)}</div><label>The download (the ZIP, or its CSV files)<input id="gf" type="file" accept=".zip,.csv" multiple></label><button id="gup">Add the download</button>
    <div class="err" id="err"></div>
    <details style="margin-top:16px"><summary>For AlmiWorld: switch on Google sign-in (once)</summary><label>Sign-in client id<input id="gid"></label><label>Sign-in client secret<input id="gsec" type="password" autocomplete="off"></label><button class="ghost" id="gsave">Save</button></details></div>`;
  $("#back").onclick = () => work("Overview");
  if ($("#connect")) $("#connect").onclick = async () => { const r = await post(`/api/products/${encodeURIComponent(P)}/google/start`, {}); if (r.refused) return ($("#err").textContent = r.refused); window.open(r.url, "_blank"); $("#err").textContent = "Finish signing in, in the window that opened — then come back here."; };
  if ($("#sites")) { const r = await get("/api/google/sites"); $("#sites").innerHTML = r.sites ? `${r.sites.map((s) => `<label class="choice"><input type="radio" name="site" value="${esc(s)}"> ${esc(s)}</label>`).join("")}<button id="pick">Use this site</button>` : `<p class="err">${esc(r.refused)}</p>`; if ($("#pick")) $("#pick").onclick = async () => { const v = document.querySelector("input[name=site]:checked")?.value; if (!v) return; const x = await post(`/api/products/${encodeURIComponent(P)}/google/site`, { site: v }); $("#err").textContent = x.line ?? x.refused; }; }
  $("#gup").onclick = async () => { const fs = [...$("#gf").files]; if (!fs.length) return ($("#err").textContent = "Choose the download first."); const files = await Promise.all(fs.map((f) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res({ name: f.name, base64: String(fr.result).split(",")[1] }); fr.readAsDataURL(f); }))); const x = await post(`/api/products/${encodeURIComponent(P)}/google/export`, { files }); $("#err").textContent = x.line ?? x.refused; if (x.ok) setTimeout(googleScreen, 1200); };
  $("#gsave").onclick = async () => { const x = await post("/api/google/client", { clientId: $("#gid").value, secret: $("#gsec").value }); $("#err").textContent = x.refused ?? "Saved — Google sign-in is switched on."; if (x.ok) setTimeout(googleScreen, 800); };
}
const hash = location.hash.slice(1);
const header = () => get("/api/home").then((H) => { $("#ver").textContent = "version " + H.version; $("#lic").textContent = H.licence; });
/* RR-303: #plan opens "Your plan"; #youtube=<product id> opens that product's YouTube settings (a link straight to a screen) */
if (hash.startsWith("product=")) { open(decodeURIComponent(hash.slice(8))); header(); }
else if (hash.startsWith("google=")) { P = decodeURIComponent(hash.slice(7)); get(`/api/products/${encodeURIComponent(P)}/state`).then((st) => { S = st; googleScreen(); }); header(); }
else if (hash === "plan") { planScreen(); header(); }
else if (hash.startsWith("youtube=")) { P = decodeURIComponent(hash.slice(8)); get(`/api/products/${encodeURIComponent(P)}/state`).then((st) => { S = st; youtubeSettings(); }); header(); }
else home();
</script>
