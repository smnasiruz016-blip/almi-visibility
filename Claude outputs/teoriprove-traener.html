<title>Teoriprøve Træner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#eef1f5;
  --card:#ffffff;
  --card-2:#f7f9fb;
  --ink:#161e28;
  --ink-2:#4a5a6b;
  --ink-3:#7b8b9c;
  --line:#d8dfe7;
  --line-2:#e7ecf1;
  --blaa:#1b5fa8;
  --blaa-dyb:#12406f;
  --blaa-blod:#e3edf7;
  --gul:#cf9320;
  --gul-blod:#fbf1dc;
  --groen:#2b7355;
  --groen-blod:#e2f0ea;
  --rod:#c0322a;
  --rod-blod:#fae7e5;
  --skygge:0 1px 2px rgba(22,30,40,.06), 0 6px 18px rgba(22,30,40,.07);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f151c;
    --card:#19212b;
    --card-2:#1f2833;
    --ink:#e7edf3;
    --ink-2:#a7b6c5;
    --ink-3:#7a8a9a;
    --line:#2c3845;
    --line-2:#242f3b;
    --blaa:#5b9ddb;
    --blaa-dyb:#9cc4e9;
    --blaa-blod:#17293c;
    --gul:#e0ad48;
    --gul-blod:#2f2617;
    --groen:#5cb38c;
    --groen-blod:#142d24;
    --rod:#e0736a;
    --rod-blod:#331b19;
    --skygge:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0f151c;
  --card:#19212b;
  --card-2:#1f2833;
  --ink:#e7edf3;
  --ink-2:#a7b6c5;
  --ink-3:#7a8a9a;
  --line:#2c3845;
  --line-2:#242f3b;
  --blaa:#5b9ddb;
  --blaa-dyb:#9cc4e9;
  --blaa-blod:#17293c;
  --gul:#e0ad48;
  --gul-blod:#2f2617;
  --groen:#5cb38c;
  --groen-blod:#142d24;
  --rod:#e0736a;
  --rod-blod:#331b19;
  --skygge:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Familjen Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 56px}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-2);
  margin-inline:-16px;padding:10px 16px;
  display:flex;align-items:center;gap:12px;
}
.topbar .tilbage{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:9px;padding:6px 11px;font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;
}
.topbar .tilbage:hover{background:var(--card-2)}
.topbar .hvor{font-size:.85rem;font-weight:600;letter-spacing:.02em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .taeller{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- forside ---------- */
.forside-top{padding:30px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{
  font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--blaa);margin-bottom:10px;
}
h1{
  font-size:clamp(1.9rem,6.4vw,2.5rem);line-height:1.08;margin:0 0 10px;
  font-weight:700;letter-spacing:-.02em;text-wrap:balance;
}
.manchet{
  font-family:Newsreader,Georgia,"Times New Roman",serif;
  font-size:1.05rem;color:var(--ink-2);margin:0;max-width:44ch;
}
.fakta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.fakta span{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.74rem;padding:5px 10px;border-radius:999px;
  background:var(--blaa-blod);color:var(--blaa-dyb);font-variant-numeric:tabular-nums;
}

/* ---------- sektioner ---------- */
.sek{margin-top:30px}
.sek-hoved{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sek-hoved h2{font-size:.78rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:0}
.sek-hoved .note{font-size:.78rem;color:var(--ink-3);font-family:"IBM Plex Mono",ui-monospace,monospace}

/* prøve-kort: den ene ting der løftes */
.proevekort{
  background:linear-gradient(160deg,var(--blaa) 0%,var(--blaa-dyb) 100%);
  color:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--skygge);
  display:flex;flex-direction:column;gap:14px;
}
.proevekort h3{margin:0;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.proevekort p{margin:0;font-size:.9rem;opacity:.9;max-width:38ch}
.proevekort .start{
  align-self:flex-start;border:none;border-radius:10px;padding:11px 20px;
  background:#fff;color:var(--blaa-dyb);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
}
.proevekort .start:hover{background:#eef4fa}

/* emneliste */
.liste{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.rk{
  display:flex;align-items:center;gap:13px;width:100%;
  border:none;border-bottom:1px solid var(--line-2);background:transparent;color:var(--ink);
  font:inherit;text-align:left;padding:13px 15px;cursor:pointer;
}
.rk:last-child{border-bottom:none}
.rk:hover{background:var(--card-2)}
.rk .mrk{
  width:30px;height:30px;flex:none;border-radius:8px;background:var(--blaa-blod);
  display:grid;place-items:center;color:var(--blaa-dyb);font-weight:700;font-size:.8rem;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
}
.rk .txt{flex:1;min-width:0}
.rk .navn{font-weight:600;font-size:.97rem;display:block}
.rk .under{font-size:.79rem;color:var(--ink-3);display:block;margin-top:1px}
.rk .hoj{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.78rem;
  padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;flex:none;
  background:var(--card-2);color:var(--ink-3);border:1px solid var(--line-2);
}
.rk .hoj.god{background:var(--groen-blod);color:var(--groen);border-color:transparent}
.rk .pil{color:var(--ink-3);flex:none;font-size:1rem}

/* ---------- spørgsmål ---------- */
.bar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:16px 0 20px}
.bar i{display:block;height:100%;background:var(--blaa);transition:width .25s ease}
.sp{
  font-family:Newsreader,Georgia,"Times New Roman",serif;
  font-size:1.32rem;line-height:1.34;font-weight:400;margin:0 0 22px;text-wrap:pretty;
}
.valg{display:flex;gap:10px}
.valg button{
  flex:1;padding:17px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:1.02rem;cursor:pointer;
  transition:border-color .12s ease, background .12s ease;
}
.valg button:hover:not(:disabled){border-color:var(--blaa);background:var(--card-2)}
.valg button:disabled{cursor:default;opacity:.55}
.valg button.er-ret{border-color:var(--groen);background:var(--groen-blod);color:var(--groen);opacity:1}
.valg button.er-forkert{border-color:var(--rod);background:var(--rod-blod);color:var(--rod);opacity:1}

.svar{margin-top:18px;border-radius:12px;padding:15px 16px;border:1px solid var(--line)}
.svar.ret{background:var(--groen-blod);border-color:color-mix(in srgb,var(--groen) 35%,transparent)}
.svar.forkert{background:var(--rod-blod);border-color:color-mix(in srgb,var(--rod) 35%,transparent)}
.svar .dom{font-weight:700;font-size:.92rem;margin-bottom:5px;letter-spacing:.01em}
.svar.ret .dom{color:var(--groen)}
.svar.forkert .dom{color:var(--rod)}
.svar .hvorfor{font-family:Newsreader,Georgia,serif;font-size:1rem;line-height:1.5;color:var(--ink)}

.naeste{
  width:100%;margin-top:18px;border:none;border-radius:11px;padding:14px;
  background:var(--blaa);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;
}
.naeste:hover{background:var(--blaa-dyb)}
.sek-knap{
  width:100%;margin-top:9px;border:1px solid var(--line);border-radius:11px;padding:12px;
  background:var(--card);color:var(--ink-2);font:inherit;font-weight:500;font-size:.92rem;cursor:pointer;
}
.sek-knap:hover{background:var(--card-2)}

.kort{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--skygge)}

/* ---------- tavler ---------- */
.tavle{display:grid;place-items:center;padding:14px 0 20px}
.tavle svg{width:158px;height:158px}
.mulighed{
  display:block;width:100%;text-align:left;margin-bottom:9px;
  padding:13px 15px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:.97rem;cursor:pointer;
}
.mulighed:hover:not(:disabled){border-color:var(--blaa);background:var(--card-2)}
.mulighed:disabled{cursor:default;opacity:.5}
.mulighed.er-ret{border-color:var(--groen);background:var(--groen-blod);color:var(--groen);opacity:1;font-weight:600}
.mulighed.er-forkert{border-color:var(--rod);background:var(--rod-blod);color:var(--rod);opacity:1}

/* ---------- resultat ---------- */
.res{text-align:center;padding:8px 0 4px}
.res .tal{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:3.1rem;font-weight:600;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;margin:14px 0 6px;
}
.res .dom{font-size:1.15rem;font-weight:700;letter-spacing:.01em}
.res .detalje{color:var(--ink-2);font-size:.9rem;margin-top:6px}
.bestaaet{color:var(--groen)} .dumpet{color:var(--rod)}
.merke{
  display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;background:var(--gul-blod);color:var(--gul);
}

.fejlliste{margin-top:22px}
.fejl{
  border-left:3px solid var(--rod);background:var(--card-2);
  border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px;
}
.fejl .fsp{font-family:Newsreader,Georgia,serif;font-size:1rem;line-height:1.4}
.fejl .fsvar{font-size:.85rem;color:var(--ink-2);margin-top:6px}
.fejl .fsvar b{color:var(--groen)}

/* ---------- ordforklaring ---------- */
.ord{display:flex;justify-content:space-between;gap:16px;padding:12px 2px;border-bottom:1px solid var(--line-2)}
.ord:last-child{border-bottom:none}
.ord dt{font-weight:600;font-size:.95rem;flex:none;max-width:44%}
.ord dd{margin:0;text-align:right;color:var(--ink-2);font-size:.9rem;
  font-family:Newsreader,Georgia,serif;line-height:1.4}
dl{margin:0}

.timer{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;font-variant-numeric:tabular-nums}
.timer.knap{color:var(--rod)}
.advarsel{
  font-size:.83rem;color:var(--ink-2);text-align:center;margin-top:16px;
  padding:11px;background:var(--gul-blod);border-radius:10px;
}
.bund{
  margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
  font-size:.78rem;line-height:1.6;color:var(--ink-3);
}
.bund b{color:var(--ink-2);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2.5px solid var(--blaa);outline-offset:2px;border-radius:6px}
</style>

<script>
"use strict";
/* ============================================================================
   TEORIPRØVE TRÆNER — dansk køreteori, øvelsesmateriale.

   Kontrollerede fakta (september 2026):
   - Teoriprøven kat. B: 25 scenarier, højst 5 fejl, 25 minutter,
     gyldig i 18 måneder, findes på dansk, engelsk, færøsk,
     grønlandsk og tysk.                       [fstyr.dk]
   - 17-årige må fra 1. juli 2025 køre alene kl. 05-20; uden for
     det tidsrum kræves ledsager.              [Transportministeriet, L165]
   - Promillegrænse 0,5. Nye bilister: 0,2 i de første 3 år.
   - Hastighed: byzone 50, landevej 80, motortrafikvej 80, motorvej 130.
     Med anhænger 80 (100 kun med tempo-100-godkendt vogntog).
   - Lys tændt hele døgnet. Barn under 135 cm: godkendt barnestol.
   - Pigdæk kun 1. nov - 15. apr, på alle fire hjul. Mønsterdybde min. 1,6 mm.
   ========================================================================== */

var EMNER = [
  {n:"hast",  t:"Hastighed",                 u:"Grænser, bremselængde og tilpasset fart"},
  {n:"spir",  t:"Spiritus og køreevne",      u:"Promille, medicin, træthed"},

  {n:"sele",  t:"Seler og børn",             u:"Sikkerhedssele, barnestol, airbag"},
  {n:"mobil", t:"Mobil og opmærksomhed",     u:"Håndholdt mobil, distraktion, klip"},
  {n:"vige",  t:"Vigepligt",                 u:"Højre vigepligt, hajtænder, rundkørsel"},

  {n:"vejr",  t:"Vejr, føre og dæk",         u:"Glat føre, tåge, pigdæk, mønsterdybde"},
  {n:"kort",  t:"Kørekort, klip og ansvar",  u:"Alder, klip, forsikring, uheld"}
];

/* [emne, påstand, sandt, forklaring] */
var SP = [
/* ---------------- HASTIGHED (18) ---------------- */

["hast","På almindelig landevej uden for byen er den generelle grænse 80 km/t.",true,"Landevej: 80 km/t, hvis intet andet er skiltet."],

["hast","På motortrafikvej må du køre 130 km/t ligesom på motorvej.",false,"Motortrafikvej er som udgangspunkt 80 km/t — den er ikke en motorvej."],
["hast","Med anhænger eller campingvogn må du køre 130 km/t på motorvejen.",false,"Med anhænger er grænsen 80 km/t. Kun et tempo-100-godkendt vogntog må køre 100 km/t."],

["hast","Fartbøder i Danmark er lave og håndhæves sjældent.",false,"Bøderne er høje og håndhæves — også over for udenlandske bilister."],

/* ---------------- SPIRITUS (18) ---------------- */

["spir","Et koldt brusebad gør dig ædru nok til at køre.",false,"Det vækker dig måske, men promillen er den samme."],

["spir","Træthed er ubehageligt, men påvirker ikke køreevnen nævneværdigt.",false,"Efter mange timer uden søvn svarer reaktionsevnen til at være påvirket af alkohol."],
["spir","Alkohol og træthed sammen er farligere end hver for sig.",true,"Virkningerne lægger sig oven i hinanden."],
["spir","Du kan vente med at finde transport, til du mærker, hvor påvirket du er.",false,"Dømmekraften er det første, alkoholen svækker — aftal transporten inden første genstand."],
["spir","Selv en lille mængde alkohol forlænger din reaktionstid.",true,"Reaktion og dømmekraft påvirkes, længe før du selv mærker det."],

["spir","Så længe du er ædru, er du altid egnet til at køre.",false,"Sygdom, stærke følelser, medicin og træthed kan gøre dig uegnet, selv uden alkohol."],

/* ---------------- LYS (18) ---------------- */
["lys","I Danmark skal du køre med lys hele døgnet, også i dagslys.",true,"Nærlys eller kørelys skal være tændt hele tiden, året rundt."],
["lys","På en klar sommerdag må du slukke alt lys.",false,"Lyset skal være tændt uanset vejr og tidspunkt."],
["lys","Kørelys foran er nok i regn og tåge, for så er du synlig forfra.",false,"Kørelys tænder ofte ikke baglygterne — i dårlig sigt skal du tænde nærlys."],
["lys","Du skal blænde ned fra fjernlys, når du møder modkørende.",true,"Skift til nærlys i god tid, så du ikke blænder den anden."],

function laes(){try{var r=localStorage.getItem(NOEGLE);return r?JSON.parse(r):{};}catch(e){return {};}}
function gem(o){try{localStorage.setItem(NOEGLE,JSON.stringify(o));}catch(e){}}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var froe=987654321^(Date.now()&0xffff);
function tilf(){froe=(froe*1103515245+12345)&0x7fffffff;return froe/0x7fffffff;}
function bland(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor((i+1)*tilf());var t=r[i];r[i]=r[j];r[j]=t;}return r;}

function spInd(n){var u=[];for(var i=0;i<SP.length;i++){if(SP[i][0]===n)u.push(SP[i]);}return u;}

/* ======================== øv efter emne ======================== */
function startEmne(n){
  S_.skaerm="oev"; S_.emne=n; S_.liste=bland(spInd(n)); S_.i=0; S_.point=0;
  tegnOev();
}
function tegnOev(){
  var q=S_.liste[S_.i], e=null;
  for(var i=0;i<EMNER.length;i++){if(EMNER[i].n===S_.emne)e=EMNER[i];}
  vis(topbar(e.t,(S_.i+1)+" / "+S_.liste.length)+
    '<div class="bar"><i style="width:'+(S_.i/S_.liste.length*100)+'%"></i></div>'+
    '<div class="kort"><p class="sp">'+esc(q[1])+'</p>'+
    '<div class="valg"><button id="j" onclick="svarOev(true)">Rigtigt</button>'+
    '<button id="n" onclick="svarOev(false)">Forkert</button></div>'+
    '<div id="sv"></div><div id="nx"></div></div>'+
    '<button class="sek-knap" onclick="hjem()">Afslut emnet</button>');
}
function svarOev(valg){
  var q=S_.liste[S_.i], ret=q[2], korrekt=(valg===ret);
  document.getElementById("j").disabled=true;
  document.getElementById("n").disabled=true;
  document.getElementById(valg?"j":"n").classList.add(korrekt?"er-ret":"er-forkert");
  if(!korrekt)document.getElementById(ret?"j":"n").classList.add("er-ret");
  if(korrekt)S_.point++;
  document.getElementById("sv").innerHTML='<div class="svar '+(korrekt?"ret":"forkert")+'">'+
    '<div class="dom">'+(korrekt?"Rigtigt":"Forkert — det rigtige svar er "+(ret?"rigtigt":"forkert"))+'</div>'+
    '<div class="hvorfor">'+esc(q[3])+'</div></div>';
  document.getElementById("nx").innerHTML='<button class="naeste" onclick="naesteOev()">'+
    (S_.i+1>=S_.liste.length?"Se resultatet":"Næste spørgsmål")+'</button>';
}
function naesteOev(){
  S_.i++;
  if(S_.i>=S_.liste.length){slutOev();return;}
  tegnOev();
}
function slutOev(){
  var pct=Math.round(S_.point/S_.liste.length*100), e=null;
  for(var i=0;i<EMNER.length;i++){if(EMNER[i].n===S_.emne)e=EMNER[i];}
  var gl=FREM["e_"+S_.emne];
  if(gl==null||pct>gl){FREM["e_"+S_.emne]=pct;gem(FREM);}
  vis(topbar(e.t)+'<div class="kort res">'+
    '<span class="merke">'+esc(e.t)+'</span>'+
    '<div class="tal">'+S_.point+' / '+S_.liste.length+'</div>'+
    '<div class="detalje">'+pct+' % rigtige'+(gl!=null&&pct>gl?' — ny bedste':'')+'</div>'+
    '</div>'+
    '<button class="naeste" onclick="startEmne(\''+S_.emne+'\')">Tag emnet igen</button>'+
    '<button class="sek-knap" onclick="hjem()">Tilbage til forsiden</button>'+bund());
}

/* ======================== færdselstavler ======================== */
function startTavler(){
  S_.skaerm="tavler"; S_.liste=bland(TAVLER.map(function(_,i){return i;})); S_.i=0; S_.point=0;
  tegnTavle();
}
function tegnTavle(){
  var t=TAVLER[S_.liste[S_.i]], m="";
  S_.raek=bland([0,1,2,3]);
  for(var i=0;i<S_.raek.length;i++){
    m+='<button class="mulighed" id="m'+i+'" onclick="svarTavle('+i+')">'+esc(t.m[S_.raek[i]])+'</button>';
  }
  vis(topbar("Færdselstavler",(S_.i+1)+" / "+S_.liste.length)+
    '<div class="bar"><i style="width:'+(S_.i/S_.liste.length*100)+'%"></i></div>'+
    '<div class="kort"><div class="tavle">'+t.s+'</div>'+
    '<p class="sp" style="font-size:1.08rem;margin-bottom:16px">'+esc(t.q)+'</p>'+m+
    '<div id="sv"></div><div id="nx"></div></div>'+
    '<button class="sek-knap" onclick="hjem()">Afslut</button>');
}
function svarTavle(valgt){
  var t=TAVLER[S_.liste[S_.i]], korrekt=(S_.raek[valgt]===t.r);
  for(var i=0;i<S_.raek.length;i++){
    var b=document.getElementById("m"+i); b.disabled=true;
    if(S_.raek[i]===t.r)b.classList.add("er-ret");
  }
  if(!korrekt)document.getElementById("m"+valgt).classList.add("er-forkert"); else S_.point++;
  document.getElementById("sv").innerHTML='<div class="svar '+(korrekt?"ret":"forkert")+'">'+
    '<div class="dom">'+(korrekt?"Rigtigt":"Forkert")+'</div><div class="hvorfor">'+esc(t.f)+'</div></div>';
  document.getElementById("nx").innerHTML='<button class="naeste" onclick="naesteTavle()">'+
    (S_.i+1>=S_.liste.length?"Se resultatet":"Næste tavle")+'</button>';
}
function naesteTavle(){
  S_.i++;
  if(S_.i>=S_.liste.length){
    var pct=Math.round(S_.point/S_.liste.length*100);
    var gl=FREM.tavler_bedste;
    if(gl==null||pct>gl){FREM.tavler_bedste=pct;gem(FREM);}
    vis(topbar("Færdselstavler")+'<div class="kort res"><span class="merke">Færdselstavler</span>'+
      '<div class="tal">'+S_.point+' / '+S_.liste.length+'</div>'+
      '<div class="detalje">'+pct+' % rigtige</div></div>'+
      '<button class="naeste" onclick="startTavler()">Tag tavlerne igen</button>'+
      '<button class="sek-knap" onclick="hjem()">Tilbage til forsiden</button>'+bund());
    return;
  }
  tegnTavle();
}

/* ======================== teoriprøve ======================== */
function startProeve(){
  S_.skaerm="proeve";
  S_.liste=bland(SP).slice(0,25);
  S_.i=0; S_.point=0; S_.svar=[];
  S_.start=Date.now(); S_.graense=25*60*1000;
  tegnProeve(); tikTid();
}
function tikTid(){
  if(S_.skaerm!=="proeve")return;
  var rest=S_.graense-(Date.now()-S_.start);
  if(rest<=0){slutProeve(true);return;}
  var el=document.getElementById("ur");
  if(el){
    var m=Math.floor(rest/60000), s=Math.floor((rest%60000)/1000);
    el.textContent=m+":"+(s<10?"0":"")+s;
    if(rest<120000)el.classList.add("knap");
  }
  S_.ur=setTimeout(tikTid,1000);
}
function tegnProeve(){
  var q=S_.liste[S_.i];
  vis('<div class="topbar"><button class="tilbage" onclick="afbrydProeve()">Afbryd</button>'+
    '<span class="hvor">Teoriprøve</span>'+
    '<span class="taeller"><span class="timer" id="ur">25:00</span> · '+(S_.i+1)+' / 25</span></div>'+
    '<div class="bar"><i style="width:'+(S_.i/25*100)+'%"></i></div>'+
    '<div class="kort"><p class="sp">'+esc(q[1])+'</p>'+
    '<div class="valg"><button onclick="svarProeve(true)">Rigtigt</button>'+
    '<button onclick="svarProeve(false)">Forkert</button></div></div>'+
    '<div class="advarsel">Ingen svar undervejs — ligesom til den rigtige prøve. Du består med højst 5 fejl.</div>');
}
function svarProeve(valg){
  var q=S_.liste[S_.i], korrekt=(valg===q[2]);
  if(korrekt)S_.point++;
  S_.svar.push({q:q,korrekt:korrekt});
  S_.i++;
  if(S_.i>=25){slutProeve(false);return;}
  tegnProeve();
}
function afbrydProeve(){ if(S_.ur){clearTimeout(S_.ur);S_.ur=null;} S_.skaerm=""; hjem(); }
function slutProeve(tidUdloeb){
  if(S_.ur){clearTimeout(S_.ur);S_.ur=null;}
  S_.skaerm="resultat";
  var fejl=25-S_.point, bestaaet=(fejl<=5)&&!tidUdloeb;
  var gl=FREM.proeve_bedste;
  if(gl==null||S_.point>gl){FREM.proeve_bedste=S_.point;gem(FREM);}
  var forkerte=S_.svar.filter(function(a){return !a.korrekt;});
  var liste="";
  if(forkerte.length){
    liste='<div class="fejlliste"><div class="sek-hoved"><h2>Dem du missede</h2>'+
      '<span class="note">'+forkerte.length+'</span></div>'+
      forkerte.map(function(a){
        return '<div class="fejl"><div class="fsp">'+esc(a.q[1])+'</div>'+
          '<div class="fsvar">Rigtigt svar: <b>'+(a.q[2]?"rigtigt":"forkert")+'</b> — '+esc(a.q[3])+'</div></div>';
      }).join('')+'</div>';
  } else if(!tidUdloeb){
    liste='<div class="kort" style="margin-top:18px;text-align:center;color:var(--ink-2)">Ingen fejl — helt rent bord.</div>';
  }
  vis(topbar("Resultat")+'<div class="kort res">'+
    '<span class="merke">Teoriprøve</span>'+
    '<div class="tal '+(bestaaet?"bestaaet":"dumpet")+'">'+S_.point+' / 25</div>'+
    '<div class="dom '+(bestaaet?"bestaaet":"dumpet")+'">'+(bestaaet?"Bestået":(tidUdloeb?"Tiden løb ud":"Ikke bestået"))+'</div>'+
    '<div class="detalje">'+fejl+' fejl · du må højst have 5</div>'+
    '<div class="detalje">'+(bestaaet?"Det ville have været nok til den rigtige prøve. Held og lykke!":"Læs forklaringerne nedenfor, og prøv igen.")+'</div>'+
    '</div>'+
    '<button class="naeste" onclick="startProeve()">Tag en ny prøve</button>'+
    '<button class="sek-knap" onclick="hjem()">Tilbage til forsiden</button>'+
    liste+bund());
}

/* ======================== ordforklaring ======================== */
function visOrd(){
  S_.skaerm="ord";
  var r=ORD.map(function(o){
    return '<div class="ord"><dt>'+esc(o[0])+'</dt><dd>'+esc(o[1])+'</dd></div>';
  }).join('');
  vis(topbar("Ordforklaring",ORD.length+" ord")+'<div class="kort"><dl>'+r+'</dl></div>'+
    '<button class="sek-knap" onclick="hjem()">Tilbage til forsiden</button>'+bund());
}

window.hjem=hjem; window.startEmne=startEmne; window.svarOev=svarOev; window.naesteOev=naesteOev;
window.startTavler=startTavler; window.svarTavle=svarTavle; window.naesteTavle=naesteTavle;
window.startProeve=startProeve; window.svarProeve=svarProeve; window.afbrydProeve=afbrydProeve;
window.visOrd=visOrd;

hjem();
</script>
