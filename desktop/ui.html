<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AlmiVisibility</title>
<style>
/*SUNRISE*/
body{margin:0;background:var(--cream);color:var(--text);font:15px/1.55 var(--font);min-height:100vh;display:flex;flex-direction:column}
main{flex:1 0 auto;width:100%;box-sizing:border-box}
h1,h2,h3{color:var(--ink);margin:0 0 6px} h1{font-size:22px} h2{font-size:18px}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--white);border-bottom:3px solid var(--peach);flex-wrap:wrap}
header img.maker{height:44px;width:auto}
header .app{font-weight:700;color:var(--ink);font-size:16px}
header .lic{margin-left:auto;color:var(--muted);font-size:13px;max-width:420px}
@media (max-width:560px){header .lic{margin-left:0;flex-basis:100%}}
.band{height:6px;background:linear-gradient(90deg,var(--coral),var(--sunrise),var(--peach))}
main{max-width:860px;margin:22px auto;padding:0 16px}
.card{background:var(--white);border:1px solid var(--peach);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(26,26,46,.04)}
.company{display:flex;align-items:center;gap:14px}
.company img{height:48px;width:auto;border-radius:8px;border:1px solid var(--peach)}
.company .site{color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.product{background:var(--white);border:1px solid var(--peach);border-radius:16px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.product:hover,.product:focus{border-color:var(--sunrise);outline:none;box-shadow:0 0 0 3px var(--teal)}
.product .addr{color:var(--muted);font-size:13px;word-break:break-all}
.badge{display:inline-block;background:var(--peach);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;margin:8px 0}
.meta{font-size:13px;color:var(--muted)}
.limit{background:var(--peach);color:var(--ink);border-radius:12px;padding:10px 14px;margin:14px 0}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;border:0;background:var(--coral);color:var(--ink);cursor:pointer}
button.alt{background:var(--sunrise)} button.ghost{background:transparent;border:1px solid var(--coral);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button[disabled]{opacity:.55;cursor:not-allowed}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--peach);border-radius:10px;width:100%;box-sizing:border-box;margin:4px 0 12px;background:var(--white);color:var(--ink)}
label{display:block;color:var(--ink)} .ask{color:var(--muted);margin:0 0 14px} .steps{color:var(--muted);font-size:13px}
.err{color:#9F1D1D;margin-top:8px;font-weight:600}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
footer{background:var(--night);color:var(--cream);padding:14px 20px;font-size:13px;text-align:center} footer b{color:var(--gold)}
/* RR-306: the next step after a licence, keys shown only as "saved ✓ (ends …1234)", the channel confirmation, advice with its source */
button.big{font-size:17px;padding:14px 26px;margin-top:8px}
.ok{color:#1F6F43;font-weight:700} .warn{background:#FFF1E6;border:1px solid var(--sunrise);border-radius:10px;padding:8px 12px;margin:8px 0}
textarea{font:inherit;padding:9px 12px;border:1px solid var(--peach);border-radius:10px;width:100%;box-sizing:border-box;margin:4px 0 12px;min-height:80px;background:var(--white);color:var(--ink)}
.keybox{border:1px dashed var(--peach);border-radius:12px;padding:10px 12px;margin:6px 0 14px}
.chan{display:flex;gap:14px;align-items:center} .chan img{width:72px;height:72px;border-radius:50%;border:1px solid var(--peach)}
.adv{border-top:1px solid var(--peach);padding:10px 0} .adv h3{font-size:15px} .k{font-weight:700;color:var(--ink)}
/* RR-307: every advice box wraps its text (the channel advice was cut off at the right edge) */
#ytbox pre,.card pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:2px 0;background:var(--cream);border-radius:8px;padding:6px 8px;max-width:100%;box-sizing:border-box}
.src{font-size:12px;color:var(--muted)} .tag{display:inline-block;background:var(--peach);border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px}
/* RR-307: the score card, the feature cards, the guided setup's progress, the first-run tour */
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap} .gauge{width:220px;text-align:center} .gauge .n{font-size:34px;font-weight:800;color:var(--ink)} .gauge .w{font-weight:700}
.areas{flex:1;min-width:240px;list-style:none;padding:0;margin:0} .areas li{padding:5px 0;border-bottom:1px solid var(--peach)} .ok-i{color:#1F6F43;font-weight:700} .warn-i{color:#9A5B00;font-weight:700} .nm-i{color:var(--muted)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px} .fcard{background:var(--white);border:1px solid var(--peach);border-radius:14px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.fcard:hover,.fcard:focus{border-color:var(--sunrise);outline:none;box-shadow:0 0 0 3px var(--teal)} .fcard h3{font-size:16px} .fcard p{margin:4px 0;font-size:13px} .rec{background:var(--sunrise);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700} .needs{color:#9A5B00;font-size:12px;font-weight:600}
.choice{display:block;border:1px solid var(--peach);border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer} .choice input{width:auto;margin-right:8px} .choice .why{font-size:13px;color:var(--muted)}
.progress{height:8px;background:var(--peach);border-radius:999px;overflow:hidden;margin:6px 0 14px} .progress>div{height:100%;background:var(--coral)}
.howto{font-size:13px;background:var(--cream);border-radius:10px;padding:8px 10px;margin:4px 0 12px} .tabline{color:var(--muted);margin:-4px 0 12px} .item{border:1px solid var(--peach);border-radius:12px;padding:10px 14px;margin:10px 0;background:#fff} .item h4{margin:0 0 4px} .item p{margin:4px 0} ul.lines{list-style:none;padding:0} li.probline .item{border-color:var(--sunrise)} .will ol li{margin:8px 0}
.tour{position:fixed;inset:0;background:rgba(26,26,46,.45);display:flex;align-items:center;justify-content:center;z-index:9} .tour .card{max-width:520px}
.paste{white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;background:var(--cream);border-radius:8px;padding:8px;overflow-wrap:anywhere}
/* RR-309: the product box with its Delete; messages coloured by what they say */
.pbox{display:flex;flex-direction:column;gap:6px} .pbox .product{flex:1} .pbox .del{align-self:flex-end;padding:6px 12px;font-size:13px}
.msg-ok{color:#1F6F43;font-weight:600;margin-top:8px} .okbar{background:#E8F6EE;border:1px solid #1F6F43;border-radius:12px;padding:10px 14px;margin:0 0 14px;color:#14532D} .msg-info{color:var(--muted);margin-top:8px}
/* RR-308: ready options with Copy, the plan, a failed check, publishing */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:6px 0} .opt{border:1px solid var(--peach);border-radius:12px;padding:10px;background:var(--white)} .opt .row{margin:4px 0} .opt pre{margin-top:2px}
button.copy{padding:2px 10px;font-size:12px;margin-left:6px} .plan{background:#FFF8EF;border-color:var(--sunrise)} .failed{background:#FDECEC;border:1px solid #C0392B;border-radius:12px;padding:12px 14px}
.prices td,.prices th{padding:4px 8px;border-bottom:1px solid var(--peach);text-align:left;vertical-align:top;font-size:13px} .prices{border-collapse:collapse;width:100%}
.draftrow{border-top:1px solid var(--peach);padding:10px 0} .editor{border:1px dashed var(--sunrise);border-radius:10px;padding:10px;min-height:120px;background:var(--white)}
.backbar{max-width:860px;width:100%;box-sizing:border-box;margin:14px auto -8px;padding:0 16px} .backbar:empty{display:none}
@media (max-width:560px){header img.maker{height:36px} .company{flex-direction:column;align-items:flex-start}}
@media (prefers-color-scheme:dark){body{background:var(--night);color:var(--cream)} h1,h2,h3,label{color:var(--cream)} .card,.product,header{background:#1E1A15;border-color:#3A2F22} .meta,.ask,.steps,.company .site,.product .addr,header .lic{color:#E7D9C3} header .app{color:var(--cream)} input,select{background:#1E1A15;color:var(--cream);border-color:#3A2F22}}
</style></head>
<body>
<header><img class="maker" src="/brand/almiworld-logo.png" alt="AlmiWorld — live beautifully"><span class="app">Visibility</span><span class="lic" id="lic"></span></header>
<div class="band"></div>
<div id="backbar" class="backbar"></div>
<main id="app"></main>
<footer>Made by <b>AlmiWorld</b> · live beautifully · <span id="ver"></span></footer>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const get = (p) => fetch(p).then((r) => r.json());
const post = async (p, o) => { const r = await fetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(o) }); const j = await r.json(); if (r.ok && !j?.refused) DIRTY = false; return j; }; // RR-315 B: what was typed is saved now
let P = null, S = null, step = 0;
/* RR-307 (owner, 22 Oct): a screen that fails says so in plain words, with a way back — never a blank page (the Dhanak YouTube settings went blank) */
/*
 * RR-314 A1: Google's sign-in page opened in the client's own browser — said, with the address to copy if no page opened; this screen
 * checks every 3 seconds (for 10 minutes) and redraws itself once the sign-in is done.
 */
function signinOpened(box, r, who, done, redraw) {
  box.classList.remove("err"); box.className = "msg-info";
  box.innerHTML = r.opened ? `Google's sign-in page opened in ${r.opened === "Chrome" ? "Chrome" : "your browser"}. ${esc(who)} This screen updates by itself when you are done.`
    : `Your browser did not open by itself. Copy this address into your browser: <code class="addr">${esc(r.url)}</code> ${copyBtn(r.url)} — ${esc(who)}`;
  wireCopy(box);
  let n = 0; const t = setInterval(async () => { n++; try { if (await done()) { clearInterval(t); redraw(); } } catch {} if (n >= 200) clearInterval(t); }, 3000);
}
/*
 * RR-314 A3 (owner: "never show it on a page that did open"). The big "This screen could not open" card is shown ONLY when the screen is
 * empty; a slip on a screen that DID open is a small line at the bottom, and the screen stays as it is.
 */
function oops() {
  if ($("#oops") || $("#slip")) return;
  if ($("#app").children.length) { const s = document.createElement("p"); s.id = "slip"; s.className = "msg-info"; s.textContent = "Something on this screen did not work just now — nothing was changed. Try again, or go back to your products."; $("#app").append(s); setTimeout(() => s.remove(), 8000); return; }
  const box = document.createElement("div"); box.className = "card"; box.id = "oops";
  box.innerHTML = `<h2>This screen could not open</h2><p>Something went wrong on this screen. Your data is safe — nothing was changed.</p><button id="oopshome">Back to my products</button>`;
  $("#app").prepend(box); $("#oopshome").onclick = () => { box.remove(); home(); };
}
/*
 * RR-315 B (owner: "Back and Next buttons"). Every screen is a step in the window's own history: "← Back" (at the top of every screen, and
 * the browser's own Back / Alt+←) returns to the screen before — the same product, the same tab, the same setup step. Anything typed and not
 * yet saved is never lost without asking: leaving such a screen asks first ("Stay" keeps it).
 */
let DIRTY = false, RESTORING = false, CUR = null;
const SCREENS = {};
const sameState = (a, b) => a && b && a.name === b.name && a.P === b.P && a.step === b.step && JSON.stringify(a.args) === JSON.stringify(b.args);
document.addEventListener("input", (e) => { if (e.target?.closest?.("#app") && !e.target.closest(".nodirty")) DIRTY = true; }, true);
document.addEventListener("change", (e) => { if (e.target?.closest?.("#app") && !e.target.closest(".nodirty")) DIRTY = true; }, true);
function askLeave() {
  return new Promise((done) => {
    const t = document.createElement("div"); t.className = "tour"; t.id = "leavemodal";
    t.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h2>Leave without saving?</h2><p>You typed something on this screen that is not saved yet. If you leave now, it is lost.</p><p><button id="leaveno">Stay on this screen</button> <button class="ghost" id="leaveyes">Leave without saving</button></p></div>`;
    document.body.appendChild(t);
    $("#leaveno").onclick = () => { t.remove(); done(false); };
    $("#leaveyes").onclick = () => { t.remove(); done(true); };
  });
}
/** called first by every screen: asks before typed data is lost, then records the screen in the window's history */
async function here(name, args = []) {
  if (RESTORING) RESTORING = false;
  else {
    if (DIRTY && !(await askLeave())) return false;
    const st = { name, args, P, step }, cur = history.state;
    if (!cur?.name) history.replaceState({ ...st, depth: 0 }, "");
    else if (sameState(cur, st)) history.replaceState({ ...st, depth: cur.depth }, "");
    else history.pushState({ ...st, depth: (cur.depth ?? 0) + 1 }, "");
  }
  DIRTY = false; CUR = history.state;
  const bar = $("#backbar"); bar.innerHTML = CUR?.depth > 0 ? `<button class="ghost" id="navback" type="button">← Back</button>` : "";
  if ($("#navback")) $("#navback").onclick = () => history.back();
  return true;
}
window.addEventListener("popstate", async (e) => {
  const s = e.state; if (!s?.name || !SCREENS[s.name]) return;
  if (DIRTY && !(await askLeave())) { history.pushState(CUR, ""); return; }
  DIRTY = false; P = s.P ?? null; step = s.step ?? 0;
  if (P) { const st = await get(`/api/products/${encodeURIComponent(P)}/state`); if (st.refused) { P = null; history.replaceState({ name: "home", args: [], P: null, step: 0, depth: s.depth }, ""); RESTORING = true; return home(); } S = st; }
  RESTORING = true; SCREENS[s.name](...(s.args ?? []));
});
window.addEventListener("error", (e) => { console.error(e.error ?? e.message); oops(); });
window.addEventListener("unhandledrejection", (e) => { console.error(e.reason); oops(); });

/* ── the first screen: the company, "What would you like to do now?", its products (RR-307 G: the cards ask; D6: a short first-run tour) ── */
async function home() {
  if (!(await here("home"))) return;
  const H = await get("/api/home");
  $("#ver").textContent = "version " + H.version; $("#lic").textContent = H.licence;
  if (!H.company) return company();
  const M = await get("/api/menu");
  const logo = H.company.logoFile ? `<img src="/company-logo" alt="${esc(H.company.name)} logo">` : "";
  $("#app").innerHTML = `<div class="card company">${logo}<div><h1>${esc(H.company.name)}</h1><div class="site">${esc(H.company.site)}</div></div></div>
  <h2>Your products</h2><div class="limit">${esc(H.limit)}</div>
  <div class="products">${H.products.map((p) => `<div class="pbox"><button class="product" data-id="${esc(p.id)}"><h3>${esc(p.name)}</h3><div class="addr">${esc(p.site ?? "no website")}</div><span class="badge">${esc(p.state)}</span><div class="meta">Pages ${p.pages} · Articles ${p.articles}</div></button><button class="ghost del" type="button" data-del="${esc(p.id)}" data-name="${esc(p.name)}" aria-label="Delete ${esc(p.name)}">🗑 Delete</button></div>`).join("") || `<div class="meta">No product yet — add your first one below.</div>`}</div>
  <p style="margin-top:16px"><button id="add" ${H.mayAdd ? "" : "disabled"}>+ Add a product</button> <button class="ghost" id="plan">Your plan${H.accountSet ? "" : " — add your licence key"}</button> <button class="ghost" id="gsignon">Google sign-in: ${H.google?.on ? "on ✓" : "switch it on"}</button></p><div class="err" id="err"></div>
  <div class="card" style="margin-top:16px"><h2>${esc(M.question)}</h2><p class="tabline">Everything Visibility can do for you. Pick a card — Visibility asks which product it is for.</p>${cardsHtml(M.cards)}</div>`;
  document.querySelectorAll(".product").forEach((b) => (b.onclick = () => openProduct(b.dataset.id)));
  document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => askDelete(b.dataset.del, b.dataset.name)));
  document.querySelectorAll(".fcard").forEach((b) => (b.onclick = () => { if (!H.products.length) return addProduct(); if (H.products.length === 1) { P = H.products[0].id; return openFeature(b.dataset.f); } $("#err").textContent = "Pick a product above first — then choose this card on its page."; window.scrollTo(0, 0); }));
  $("#add").onclick = () => addProduct();
  $("#plan").onclick = () => planScreen();
  $("#gsignon").onclick = () => googleSignInScreen(home);
  tour();
}
/* RR-309 A: Delete, right on the product's box — asked first, in the owner's words; only this product goes */
function askDelete(id, name) {
  const t = document.createElement("div"); t.className = "tour"; t.id = "delmodal";
  t.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h2>Delete ${esc(name)}?</h2><p><b>Are you sure?</b> This removes the product and its saved data from this computer.</p><p class="meta">Your other products, your plan and their keys are not touched.</p>
    <p><button class="ghost" id="delno">Cancel</button> <button id="delyes">Delete</button></p><p id="delmsg"></p></div>`;
  document.body.appendChild(t);
  $("#delno").onclick = () => t.remove();
  $("#delyes").onclick = async () => { $("#delyes").disabled = true; const r = await post(`/api/products/${encodeURIComponent(id)}/delete`, { confirm: true }); if (r.refused) { note($("#delmsg"), r.refused, "err"); $("#delyes").disabled = false; return; } t.remove(); home(); };
}
/* RR-309 B3: a message is coloured by what it says — a success or "working…" is never red, not even for a moment */
function note(el, text, kind = "info") { if (!el) return; el.classList.remove("err", "msg-ok", "msg-info", "meta"); el.classList.add(kind === "ok" ? "msg-ok" : kind === "err" ? "err" : "msg-info"); el.textContent = text; }
/* the cards, from the app's own feature list: what it does, what you get, time or cost, what it needs; recommended first */
function cardsHtml(cards, { checking = false } = {}) {
  const sorted = [...cards.filter((c) => c.recommended), ...cards.filter((c) => !c.recommended)];
  /* a check that is running is never offered again — its card says so */
  return `<div class="fcards">${sorted.map((c) => c.id === "check" && checking ? `<button class="fcard" disabled><h3>${esc(c.title)}</h3><p><b>Running now</b> — see its progress at the top of this page.</p></button>` : `<button class="fcard" data-f="${esc(c.id)}"><h3>${esc(c.title)} ${c.recommended ? `<span class="rec">Recommended for you now</span>` : ""}</h3><p>${esc(c.does)}</p><p><b>You get:</b> ${esc(c.youGet)}</p><p class="meta">${esc(c.time)}</p>${c.needs?.length ? `<p class="needs">Needs: ${esc(c.needs.map((n) => n.what).join("; "))}</p>` : ""}</button>`).join("")}</div>`;
}
async function tour() {
  if (!(await get("/api/tour")).show) return;
  const steps = ["Add a product — your website, your YouTube channel, or both.", "Visibility checks it at once and gives you a score out of 100, with what to fix first.", "Pick a card under \"What would you like to do now?\" — new pages, answers, AI search, YouTube advice and more.", "Nothing is published without your choice. Everything Visibility writes is a draft until you say so."];
  const t = document.createElement("div"); t.className = "tour";
  t.innerHTML = `<div class="card"><h2>Welcome to Visibility</h2><ol>${steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol><button id="tourclose">Got it</button></div>`;
  document.body.appendChild(t);
  $("#tourclose").onclick = async () => { await post("/api/tour", {}); t.remove(); };
}
/* RR-303 A: the licence key from the page shown after a purchase — saved in the app; never shown back.
   RR-306 A1: once saved, a clear "Licence saved ✓" and one big next step. */
async function planScreen() {
  if (!(await here("planScreen"))) return;
  $("#app").innerHTML = `<p><button class="ghost" id="home">⌂ All products</button></p><div class="card"><h2>Your plan</h2><p class="ask">Paste the licence key shown after you bought your plan (it starts with av_) — or the owner licence (it starts with avo_).</p>
  <label>Licence key<input id="k1" autocomplete="off" spellcheck="false"></label><button id="save">Save</button><div class="err" id="err"></div></div>`;
  $("#home").onclick = home;
  $("#save").onclick = async () => {
    const r = await post("/api/account", { licenceKey: $("#k1").value }); if (r.refused) return ($("#err").textContent = r.refused);
    const H = await get("/api/home"); $("#lic").textContent = H.licence;
    $("#app").innerHTML = `<div class="card"><h2 class="ok">Licence saved ✓</h2><p>${esc(r.line)}</p><button class="big" id="next">${H.products.length ? "Continue — go to your products" : "Continue — add your first product"}</button></div>`;
    $("#next").onclick = () => (H.products.length || !H.company ? home() : addProduct());
  };
}
/* RR-306 A3: a key box — the client pastes the key; the app shows only "saved ✓ (ends …1234)" and can replace or remove it */
/* RR-315 C (owner): "How to get it" next to each key and connection — a guide in its OWN window, so the client reads it while pasting here.
   The guides are part of the app (desktop/guides.mjs): they work without the internet. */
const GUIDE_FOR = { YOUTUBE_API_KEY: "youtube-key", ANTHROPIC_API_KEY: "anthropic-key", anthropic: "anthropic-key", google: "google-client" };
const guideLink = (g) => (g ? `<a href="/guide/${esc(g)}" class="guide" data-guide="${esc(g)}" target="_blank" rel="noopener">How to get it ↗</a>` : "");
function wireGuides(root = document) { root.querySelectorAll("[data-guide]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); window.open(`/guide/${a.dataset.guide}`, `avguide-${a.dataset.guide}`, "popup,width=820,height=900"); })); }
const keyStatus = (st) => (st?.saved ? `<span class="ok">saved ✓ (ends …${esc(st.ends)})</span> <span class="meta">${esc(st.where)}</span>` : `<span class="meta">not saved yet</span>`);
function keyBox(name, label, st) {
  return `<div class="keybox" data-key="${esc(name)}"><div><b>${esc(label)}</b>: <span class="kst">${keyStatus(st)}</span> ${guideLink(GUIDE_FOR[name])}</div>
  <input class="kin" type="password" autocomplete="off" spellcheck="false" placeholder="${st?.saved ? "Paste a new key to replace it" : "Paste your key here"}">
